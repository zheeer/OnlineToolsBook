name: Deploy IMA Knowledge Page

on:
  push:
    branches: [master]
    paths:
      - 'ima-knowledge/**'
      - '.github/workflows/ima-knowledge-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload page
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./ima-knowledge

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
